[project]
name = "gyeol-data"
version = "0.1.0"
description = "Data pipelines for Gyeol"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13.4",
  "datasets>=4.8.4",
  "httpx>=0.28.1",
  "pandas>=3.0.2",
  "pillow>=12.2.0",
  "playwright>=1.55.0",
  "pyarrow>=23.0.1",
  "pydantic>=2.11.9",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0.3",
  "torch",
  "torchvision",
  "ultralytics>=8.4.33",
  "transformers>=5.5.3",
  "qdrant-client>=1.17.1",
  "flagembedding>=1.3.5",
  "sentence-transformers>=5.4.0",
  "python-mecab-ko>=1.3.7",
  "boto3>=1.34.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
